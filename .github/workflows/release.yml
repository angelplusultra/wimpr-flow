# Builds the Windows installer and the Linux AppImage + pacman package. Each OS builds on
# its own runner because pnpm only installs the native packages for the machine it runs on.
# macOS is built locally (`pnpm dist:mac`): it's signed with a certificate in your keychain.
#
# Push a tag like v0.2.0 to attach the builds to a draft release; run it by hand to just
# get them as workflow artifacts.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              dist/*.exe
          # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
          - os: ubuntu-22.04
            target: linux
            files: |
              dist/*.AppImage
              dist/*.pacman
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

      - name: Install pacman packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # transcribe.cpp needs the VC++ runtime 14.40+, which a fresh Windows may not have.
      # Ship it app-local: next to the exe, and next to transcribe.dll, since how the DLL
      # search finds it depends on how the library is loaded.
      - name: Bundle the VC++ runtime
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "VC++ runtime not found under $vs" }
          Write-Host "Using $($crt.FullName)"
          New-Item -ItemType Directory -Force build/win-crt | Out-Null
          Copy-Item "$($crt.FullName)\*.dll" build/win-crt
          Copy-Item "$($crt.FullName)\*.dll" node_modules/@transcribe-cpp/win32-x64-cpu-vulkan
          Get-ChildItem build/win-crt

      - run: pnpm dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: wimpr-flow-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: ${{ matrix.files }}
