<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fuck Wispr Flow app icon. Rebuild: see README "App icon". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centered on the 1024 canvas -->
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <g fill="#fff">
    <rect x="244" y="412" width="72" height="200" rx="36"/>
    <rect x="360" y="322" width="72" height="380" rx="36"/>
    <rect x="476" y="252" width="72" height="520" rx="36"/>
    <rect x="592" y="342" width="72" height="340" rx="36"/>
    <rect x="708" y="422" width="72" height="180" rx="36"/>
  </g>
</svg>
